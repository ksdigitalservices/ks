<script>
(function () {
  const defaults = {
    name: "N SREE DEVI",
    dobgender: "28-Aug-1971/F",
    category: "Pensioner",
    relation: "SPOUSE",
    entitlement: "General",
    validity: "22-Aug-2025 To 01-Jan-2099",
    benid: "20091025"
  };

  function setEditableMode(on) {
    document.body.classList.toggle("editing", on);
    document.querySelectorAll(".editable").forEach(el => {
      el.contentEditable = on ? "true" : "false";
      el.spellcheck = false;
    });
  }

  window.toggleEdit = function () {
    const turningOff = document.body.classList.contains("editing");
    setEditableMode(!document.body.classList.contains("editing"));

    // When Edit Mode is turned OFF, rebuild the front-page QR from the
    // current text fields.
    if (turningOff) {
      updateFrontQR();
      saveData(false);
    }
  };

  window.saveData = function(showMessage = true) {
    const data = {};
    document.querySelectorAll(".editable").forEach(el => {
      data[el.dataset.key] = el.textContent.trim();
    });
    localStorage.setItem("cghsEditableCard", JSON.stringify(data));

    // Keep the QR synchronized whenever changes are explicitly saved.
    updateFrontQR();

    if (showMessage) alert("Changes saved and QR code updated.");
  };

  function getField(key) {
    const el = document.querySelector('.editable[data-key="' + key + '"]');
    return el ? el.textContent.trim() : "";
  }

  // Two-way live synchronization of the BEN ID on front and back.
  function setupBenIdSync() {
    const fields = document.querySelectorAll('.editable[data-key="benid"]');

    fields.forEach(field => {
      field.addEventListener("input", function () {
        const value = this.textContent.trim();

        fields.forEach(other => {
          if (other !== this && other.textContent.trim() !== value) {
            other.textContent = value;
          }
        });

        if (typeof updateFrontQR === "function") {
          updateFrontQR();
        }
      });

      field.addEventListener("blur", function () {
        const value = this.textContent.trim();
        fields.forEach(other => {
          if (other !== this) other.textContent = value;
        });
        if (typeof updateFrontQR === "function") updateFrontQR();
      });
    });
  }

  function buildQRText() {
    const benId = getField("benid");
    const name = getField("name");
    const dobGender = getField("dobgender");

    // DOB/GENDER is stored as e.g. "28-Aug-1971/F"; use the part after "/".
    let gender = "";
    if (dobGender.includes("/")) {
      gender = dobGender.split("/").pop().trim();
    } else {
      gender = dobGender.trim();
    }

    const relation = getField("relation");

    return "BenId: " + benId +
           ", Name: " + name +
           ", gender: " + gender +
           ",relationname:" + relation;
  }

  function updateFrontQR() {
    const qrImage = document.querySelector(".front .qr");
    const generator = document.getElementById("qrGenerator");
    if (!qrImage || !generator || typeof QRCode === "undefined") return;

    const text = buildQRText();

    // Clear the previous generated QR.
    generator.innerHTML = "";

    new QRCode(generator, {
      text: text,
      width: 256,
      height: 256,
      correctLevel: QRCode.CorrectLevel.M
    });

    const canvas = generator.querySelector("canvas");
    const img = generator.querySelector("img");

    // QRCode.js may create canvas or img depending on browser.
    if (canvas) {
      qrImage.src = canvas.toDataURL("image/png");
    } else if (img) {
      qrImage.src = img.src;
    }

    // Store the generated QR for persistence in this browser.
    setTimeout(() => {
      if (canvas) {
        localStorage.setItem("cghs_generatedQR", canvas.toDataURL("image/png"));
      } else if (img) {
        localStorage.setItem("cghs_generatedQR", img.src);
      }
    }, 50);
  }

  window.resetData = function () {
    if (!confirm("Reset all editable text to the original values?")) return;
    document.querySelectorAll(".editable").forEach(el => {
      el.textContent = defaults[el.dataset.key] || "";
    });
    localStorage.removeItem("cghsEditableCard");
  };

  function loadData() {
    try {
      const data = JSON.parse(localStorage.getItem("cghsEditableCard") || "{}");
      document.querySelectorAll(".editable").forEach(el => {
        if (data[el.dataset.key] !== undefined) el.textContent = data[el.dataset.key];
      });
    } catch(e) {}
  }

  function setupImageInput(inputId, imageSelector) {
    const input = document.getElementById(inputId);
    const img = document.querySelector(imageSelector);
    input.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        img.src = e.target.result;
        localStorage.setItem("cghs_" + inputId, e.target.result);
      };
      reader.readAsDataURL(file);
    });
  }

  function loadImage(key, selector) {
    const saved = localStorage.getItem(key);
    if (saved) document.querySelector(selector).src = saved;
  }

  window.addEventListener("DOMContentLoaded", () => {
    loadData();
    setEditableMode(false);

    setupImageInput("photoInput", ".beneficiary-photo");
    setupImageInput("qrInput", ".front .qr");
    setupImageInput("signatureInput", ".front .signature");

    loadImage("cghs_photoInput", ".beneficiary-photo");
    loadImage("cghs_qrInput", ".front .qr");
    loadImage("cghs_signatureInput", ".front .signature");

    setupBenIdSync();

    // Generate a QR from the current fields when the page loads.
    // This makes the card stay synchronized with saved beneficiary details.
    setTimeout(updateFrontQR, 100);
  });
})();
</script>
</body>
</html>
