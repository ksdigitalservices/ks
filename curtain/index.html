<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Opens Soon</title>

    <link
        rel="stylesheet"
        href="../css/booking.css"
    >

    <script src="../js/booking-config.js"></script>
</head>

<body>

    <main class="curtain-page">

        <section class="curtain-card">

            <div class="lock-icon">
                🔒
            </div>

            <h1>
                Booking Opens Soon
            </h1>

            <p class="opening-text">
                Booking opens at
                <strong id="openingTime">
                    22:10 PM
                </strong>
                <span>IST</span>
            </p>

            <div
                id="countdown"
                class="countdown"
                aria-live="polite"
            >
                00h 00m 00s
            </div>

            <p class="timezone">
                India Standard Time (IST)
            </p>

        </section>

    </main>


   <script>
    const openingTimeElement =
        document.getElementById("openingTime");

    const countdownElement =
        document.getElementById("countdown");


    /*
     * Display the configured opening time.
     */
    openingTimeElement.textContent =
        getOpeningTimeText();


    function updateCountdown() {

        /*
         * Get the next opening time.
         */
        const target = getNextOpeningDate();


        /*
         * Get current India time.
         */
        const now = getIndiaNowAsUTC();


        /*
         * Difference in milliseconds.
         */
        const difference =
            target.getTime() - now.getTime();


        /*
         * Once the configured opening time is reached,
         * DO NOT redirect anywhere.
         *
         * Keep the visitor on the curtain page.
         */
        if (difference <= 0) {

            countdownElement.textContent =
                "00h 00m 00s";

            return;
        }


        /*
         * Convert milliseconds into seconds.
         */
        const totalSeconds =
            Math.max(
                0,
                Math.floor(difference / 1000)
            );


        const hours =
            Math.floor(totalSeconds / 3600);

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;


        /*
         * Format with leading zeroes.
         */
        const formattedHours =
            String(hours).padStart(2, "0");

        const formattedMinutes =
            String(minutes).padStart(2, "0");

        const formattedSeconds =
            String(seconds).padStart(2, "0");


        countdownElement.textContent =
            `${formattedHours}h ` +
            `${formattedMinutes}m ` +
            `${formattedSeconds}s`;
    }


    /*
     * Update immediately.
     */
    updateCountdown();


    /*
     * Update every second.
     */
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
